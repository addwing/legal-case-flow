name: smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 冒烟测试（零依赖，不需要装任何库）
        run: bash tests/smoke.sh

      - name: 安装器试运行
        run: |
          bash install.sh --dry-run
          bash install.sh --to "$RUNNER_TEMP/skills" --no-verify
          test -f "$RUNNER_TEMP/skills/legal-case-flow/SKILL.md"
          python3 "$RUNNER_TEMP/skills/legal-case-flow/scripts/flow.py" init "$RUNNER_TEMP/case" --title "示例案"
          python3 "$RUNNER_TEMP/skills/legal-case-flow/scripts/flow.py" next "$RUNNER_TEMP/case"

      - name: 卸载要干净
        run: |
          bash install.sh --to "$RUNNER_TEMP/skills" --uninstall
          test ! -e "$RUNNER_TEMP/skills/legal-case-flow"
